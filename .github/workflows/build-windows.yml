name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_API_ACCESS_TOKEN: ${{ secrets.VITE_API_ACCESS_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify build configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_API_URL) -or [string]::IsNullOrWhiteSpace($env:VITE_API_ACCESS_TOKEN)) {
            throw "Set VITE_API_URL and VITE_API_ACCESS_TOKEN as repository secrets before building."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm --workspace apps/desktop run build

      - name: Package Windows app
        run: npx electron-builder --projectDir apps/desktop --win nsis zip --x64 --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Mentor-Simulator-Windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14
