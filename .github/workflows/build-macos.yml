name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_API_ACCESS_TOKEN: ${{ secrets.VITE_API_ACCESS_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify build configuration
        shell: bash
        run: |
          if [[ -z "$VITE_API_URL" || -z "$VITE_API_ACCESS_TOKEN" ]]; then
            echo "Set VITE_API_URL and VITE_API_ACCESS_TOKEN as repository secrets before building."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm --workspace apps/desktop run build

      - name: Package macOS app
        run: npx electron-builder --projectDir apps/desktop --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Mentor-Simulator-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14
